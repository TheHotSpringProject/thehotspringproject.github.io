name: Photo candidates for review
# Manual. Gathers candidate Commons photos per spring into data/photo_candidates.json for review.html.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/photo_candidates.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/photo_candidates.json || true
          git diff --cached --quiet || git commit -m "Update photo candidates for review"
          git pull --rebase && git push
