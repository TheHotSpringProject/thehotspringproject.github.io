name: More spring photos
# Manual only. Adds photos from Wikidata images and Commons categories named after springs to data/photos.json.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/photo_sources.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/photos.json
          git diff --cached --quiet || git commit -m "Add photos from Wikidata and Commons categories"
          git pull --rebase && git push
