name: Commons photos
# Manual only. Finds freely licensed Wikimedia Commons photos taken at each spring (data/photos.json).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/commons_photos.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/photos.json || true
          git diff --cached --quiet || git commit -m "Update Commons photo matches"
          git pull --rebase && git push
