name: Spring data (state surveys, NBMG, NM, Water Quality Portal, GNIS)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 1 */3 *'   # quarterly refresh
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/state_survey.py
      - run: python tools/merge_state_survey.py
      - run: python tools/named_springs.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ss_raw.json data/springs.json data/named_springs.json
          git diff --cached --quiet || git commit -m "Update state-survey springs"
          git pull --rebase -q || true
          git push
