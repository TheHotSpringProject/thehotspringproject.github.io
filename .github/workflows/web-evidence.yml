name: Soaking evidence (Wikipedia list + Google Places)
# Manual only: this job makes paid Google Places requests, so it must never run on its own.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python tools/web_evidence.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/wiki_hotsprings_list.json data/places_evidence.json
          git diff --cached --quiet || git commit -m "Update soaking web evidence"
          git pull --rebase -q || true
          git push
