name: Worldwide springs data
# Manual only. Fetches hot springs worldwide from OpenStreetMap (Overpass) and Wikidata into data/world_raw.json.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/world.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/world_raw.json
          git diff --cached --quiet || git commit -m "Update worldwide springs raw data"
          git pull --rebase && git push
